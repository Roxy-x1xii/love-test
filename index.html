let answers=[],current=0,advancing=false,advanceTimer;const app=document.getElementById('app');
function home(){app.innerHTML=`<section class="screen hero"><div class="eyebrow">一份关于亲密关系的小小观察</div><div class="orb" aria-hidden="true">✳</div><h1>测测你容易吸引<br>什么样的恋人</h1><p>你如何度过普通的一天，也藏着你与人靠近的方式。<br>从24个相处片段，探索你的关系倾向与角色引力。</p><div class="meta"><span>24 道生活选择题</span><span>约 3–5 分钟</span><span>16 种关系画像</span></div><button onclick="start()">开始探索</button><p class="fine">按第一反应选择即可，无需选“更好的自己”。<br>所有答案仅保留在本页，刷新后清空。</p></section>`}
function start(){clearTimeout(advanceTimer);advancing=false;answers=[];current=0;render()}
function render(){const q=questions[current];app.innerHTML=`<section class="screen card"><div class="topline"><span>发现日常里的你</span><span>第 ${current+1} / 24 题</span></div><div class="track" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="24" aria-valuenow="${answers.filter(x=>x!==undefined).length}"><div class="fill" style="width:${answers.filter(x=>x!==undefined).length/24*100}%"></div></div><h2 tabindex="-1">${q[0]}？</h2><div class="options">${order(current).map((v,i)=>`<button class="option ${answers[current]===v?'selected':''}" aria-pressed="${answers[current]===v}" onclick="choose(${v})"><span class="letter">${'ABCD'[i]}</span><span>${q[v+1]}</span></button>`).join('')}</div><div class="controls"><button class="sub" onclick="back()">${current?'上一题':'返回首页'}</button><button onclick="next()" ${answers[current]===undefined?'disabled style="opacity:.4;cursor:default"':''}>${current===23?'查看我的引力':'下一题'}</button></div><p class="fine">选择后自动进入下一题，可随时返回修改。</p></section>`;app.querySelector('h2').focus({preventScroll:true})}
function order(i){return [0,1,2,3].map(x=>(x+i%4)%4)}
function choose(v){if(advancing)return;answers[current]=v;next()}
function back(){clearTimeout(advanceTimer);advancing=false;if(current){current--;render()}else home()}
function next(){clearTimeout(advanceTimer);advancing=false;if(answers[current]===undefined)return;if(current<23){current++;render()}else result()}
// 四维原型：探索、共情、稳定、自主。主选维度+3，相邻互补维度+1。
function score(a){const s=[0,0,0,0];a.forEach(v=>{s[v]+=3;s[(v+1)%4]+=1});return s}
